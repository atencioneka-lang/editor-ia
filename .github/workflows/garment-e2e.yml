name: Real clothing edit in Editor IA browser

on:
  push:
    paths:
      - 'tests/garment-e2e.mjs'
      - '.github/workflows/garment-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  garment-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app dependencies
        run: npm install --no-audit --no-fund
      - name: Install browser testing tools
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Build web application
        run: npm run build
        env:
          EDITOR_IA_DEPLOY: github-pages
      - name: Run browser with adult clothing photo and apply AI
        run: |
          EDITOR_IA_DEPLOY=github-pages npm run preview -- --host 127.0.0.1 > /tmp/editor-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -f -s http://127.0.0.1:4173/editor-ia/ >/dev/null; then break; fi
            sleep 1
          done
          EDITOR_TEST_URL=http://127.0.0.1:4173/editor-ia/ node tests/garment-e2e.mjs
      - name: Save original, edited photograph and browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garment-e2e-photos
          path: artifacts/clothing-e2e/
          if-no-files-found: warn
